[project]
name = "guion"
version = "0.1.0"
description = "Web dashboard to orchestrate RPA automations (Flask + Selenium)"
authors = [{ name = "Israel Holetz", email = "holetz@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Web stack (Flask 3.1 line)
    "flask>=3.1.3",
    "werkzeug>=3.1.9",
    "jinja2>=3.1.6",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "wtforms>=3.2.1",
    "flask-wtf>=1.2.2",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.0.36",
    "email-validator>=2.2.0",
    "flask-minify>=0.49",
    "python-dotenv>=1.2.2",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.10",
    "bcrypt>=4.2.0",
    # Automation projects
    "pandas>=2.2.2,<3",
    "openpyxl>=3.1.5",
    "selenium>=4.27",
    "requests>=2.33",
    "urllib3>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "zensical>=0.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
